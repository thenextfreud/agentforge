[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oauth-protected-server"
version = "1.0.0"
description = "Remote MCP server over Streamable HTTP, gated by OAuth 2.0 JWKS validation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.10",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "PyJWT>=2.8",
    "cryptography>=42",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "starlette>=0.37",
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
oauth-protected-server = "src.server:main"

[tool.setuptools]
packages = ["src", "src.lib", "src.tools"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
