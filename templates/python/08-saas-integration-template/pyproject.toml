[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "saas-integration-template"
version = "1.0.0"
description = "SaaS-wrapping MCP server template with retries, pagination, webhooks, and OAuth2 client credentials"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.10",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
saas-integration-server = "src.server:main"

[tool.setuptools]
packages = ["src", "src.lib", "src.tools"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
