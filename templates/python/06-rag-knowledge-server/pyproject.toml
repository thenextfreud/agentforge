[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-knowledge-server"
version = "1.0.0"
description = "RAG (Retrieval-Augmented Generation) MCP server with pluggable embeddings and vector stores"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.10",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
local = ["sentence-transformers>=2.7"]
openai = ["openai>=1.30"]
chroma = ["chromadb>=0.5"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
rag-knowledge-server = "src.server:main"

[tool.setuptools]
packages = ["src", "src.lib", "src.tools"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
